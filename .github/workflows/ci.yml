# =============================================================================
# FILE:    .github/workflows/ci.yml
# PURPOSE: Quality gate for every pull request: install, lint, typecheck,
#          build the web app, run Worker tests in real workerd, and prove the
#          committed Wrangler config still deploys (dry run).
# USED BY: GitHub — runs automatically on pull requests.
#
# Production deploys are NOT done here: pushing to `main` deploys through
# Cloudflare Workers Builds. See docs/deployment.md.
# =============================================================================

name: CI

on:
  pull_request:

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Installs the pnpm version from the "packageManager" field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck all packages
        run: pnpm typecheck

      # Builds the web app first: the Worker tests and the dry run both read
      # the assets directory it produces.
      - name: Build web app
        run: pnpm build

      - name: Test Worker in real workerd
        run: pnpm test

      - name: Wrangler deploy dry run
        run: pnpm deploy:dry-run
